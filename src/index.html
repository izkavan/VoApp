<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoApp - The Voice Over Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <nav id="main-nav">
            <ul>
                <li><a href="#" id="nav-character-library" class="active">Character Library</a></li>
                <li><a href="#" id="nav-voice-actors">Voice Actor View</a></li>
                <li><a href="#" id="nav-utilities">Utility View</a></li>
            </ul>
        </nav>

        <div id="character-library-view" class="view">
            <div id="app">
                <header>
                    <h1>Vocal Characters</h1>
                    <div class="header-buttons">
                        <button id="new-character-button">New Character</button>
                        <button id="new-project-button">New Project</button>
                        <button id="import-project-button">Import Project</button>
                    </div>
                </header>
                <main>
                    <div id="filter-section">
                        <div id="active-tags-container"></div>
                        <input id="filter-tags" placeholder="Filter by tags...">
                        <div id="tag-suggestions"></div>
                        <div id="exclusive-toggle-container">
                            <label class="switch">
                                <input type="checkbox" id="exclusive-toggle">
                                <span class="slider"></span>
                            </label>
                            <span>Exclusive Search</span>
                        </div>
                    </div>
                    <div id="character-list">
                        <!-- Character cards will be dynamically inserted here -->
                    </div>
                </main>
            </div>
        </div>

        <div id="voice-actor-view" class="view hidden">
            <div class="tab-container">
                <div class="tab-nav">
                    <button class="tab-link active" data-tab="scripts">Scripts</button>
                    <button class="tab-link" data-tab="auditions">Auditions</button>
                    <button class="tab-link" data-tab="misc">Misc</button>
                </div>
                <div id="scripts" class="tab-content active">
                    <h2>Line Reader</h2>
                    <label for="script-file-input" class="custom-file-input">Upload Script</label>
                    <input type="file" id="script-file-input" accept=".txt,.zip">
                    <input type="text" id="script-name-input" placeholder="Script Name..." />
                    <select id="script-project-select"></select>
                    <div id="line-container"></div>
                    <div class="line-reader-controls">
                        <button id="read-button">Read</button>
                        <button id="omit-button">Omit</button>
                        <button id="remit-button">Remit</button>
                        <button id="reset-button">Reset</button>
                    </div>
                    <div class="read-view-wrapper">
                        <div id="read-container"></div>
                        <div id="read-details"></div>
                    </div>
                    <div class="script-save-container">
                        <button id="save-button">Save Script</button>
                    </div>
                </div>
                <div id="auditions" class="tab-content">
                    <div class="audition-header">
                        <h2>Auditions</h2>
                        <button id="new-audition-button">New Audition</button>
                    </div>
                    <div id="active-audition-list"></div>
                    <div class="collapsible-section">
                        <h3 class="collapsible-header">Inactive Auditions</h3>
                        <div id="inactive-audition-list" class="collapsible-content"></div>
                    </div>
                </div>
                <div id="misc" class="tab-content">
                    <h2>Misc</h2>
                    <p>Undecided work goes here.</p>
                </div>
            </div>
        </div>

        <div id="utility-view" class="view hidden">
            <div class="tab-container">
                <div class="tab-nav">
                    <button class="tab-link active" data-tab="warm-ups">Vocal Warm Ups</button>
                    <button class="tab-link" data-tab="voice-memos">Voice Memos</button>
                </div>
                <div id="warm-ups" class="tab-content active">
                    <h2>Vocal Warm Ups</h2>
                    <div id="warm-up-text" class="warm-up-container"></div>
                    <div class="warm-up-controls">
                        <button id="warm-up-record-button" class="record-button">●</button>
                        <div id="warm-up-audio-player"></div>
                    </div>
                </div>
                <div id="voice-memos" class="tab-content">
                    <div class="voice-memo-header">
                        <h2>Voice Memos</h2>
                        <button id="new-voice-memo-button">New Voice Memo</button>
                    </div>
                    <div class="voice-memo-controls">
                        <div class="voice-memo-filters">
                            <input type="text" id="voice-memo-search-tags" placeholder="Search by tag...">
                        </div>
                        <div class="voice-memo-actions">
                            <div class="left-actions">
                                <button id="export-voice-memos-button">Export Selected to ZIP</button>
                                <button id="delete-voice-memos-button">Delete Selected</button>
                            </div>
                            <div class="right-actions">
                                <div id="important-first-toggle-container">
                                    <label class="switch">
                                        <input type="checkbox" id="voice-memo-sort-important-first">
                                        <span class="slider"></span>
                                    </label>
                                    <span>Important First</span>
                                </div>
                                <select id="voice-memo-sort-select">
                                    <option value="date">Sort by Date</option>
                                    <option value="name">Sort by Name</option>
                                    <option value="size">Sort by Size</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div id="voice-memo-list" class="voice-memo-list">
                        <!-- Voice memos will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden">
        <div id="modal-content">
            <span id="modal-close">&times;</span>
            <div id="modal-view-content"></div>
        </div>
    </div>

    <div id="project-modal" class="hidden">
        <div id="modal-content">
            <span id="project-modal-close">&times;</span>
            <h2>Edit Project</h2>
            <input id="project-name" placeholder="Project Name">
            <textarea id="project-description" placeholder="Project Description"></textarea>
            <input id="project-licensing" placeholder="Licensing">
            <label for="project-start-date">Start Date:</label>
            <input type="date" id="project-start-date">
            <label for="project-end-date">End Date:</label>
            <input type="date" id="project-end-date">
            <div class="modal-footer">
                <button id="delete-project-button">Delete Project</button>
                <button id="export-project-button">Export Project</button>
                <button id="save-project-button">Save Project</button>
            </div>
        </div>
    </div>

    <div id="audition-modal" class="hidden">
        <div id="modal-content">
            <span id="audition-modal-close">&times;</span>
            <div id="audition-modal-content"></div>
        </div>
    </div>

    <div id="voice-memo-modal" class="hidden">
        <div id="modal-content">
            <span id="voice-memo-modal-close">&times;</span>
            <h2>New Voice Memo</h2>
            
            <div class="voice-memo-record-section">
                <button id="voice-memo-record-button" class="record-button">●</button>
                <span id="voice-memo-record-status">Ready to record</span>
                <div id="voice-memo-audio-preview"></div>
            </div>

            <input id="voice-memo-title" placeholder="Memo Title">
            
            <div class="tag-input-container">
                <div id="voice-memo-active-tags-container"></div>
                <input id="voice-memo-tags" placeholder="Add tags...">
                <div id="voice-memo-tag-suggestions" class="tag-suggestions"></div>
            </div>

            <select id="voice-memo-project-select">
                <option value="">Unassigned</option>
            </select>

            <div class="checkbox-container">
                <input type="checkbox" id="voice-memo-importance">
                <label for="voice-memo-importance">High Importance</label>
            </div>

            <div class="modal-footer">
                <button id="save-voice-memo-button" disabled>Save Memo</button>
            </div>
        </div>
    </div>

    <div id="theme-toggle" class="theme-toggle">
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>

    <script type="importmap">
    {
        "imports": {
            "jszip": "https://esm.run/jszip"
        }
    }
    </script>
    <script src="index.js" type="module"></script>
</body>
</html>
